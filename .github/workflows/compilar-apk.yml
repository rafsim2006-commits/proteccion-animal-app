name: Compilar APK

# Se ejecuta manualmente desde la pestaña "Actions" de GitHub
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compilar:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar plataforma Android
        run: npx cap add android

      - name: Sincronizar la app
        run: npx cap sync android

      - name: Aplicar permisos de camara y galeria
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "--- Manifest antes ---"
          head -20 "$MANIFEST"

          # Insertar los permisos ANTES de la etiqueta <application>
          # (no se reemplaza el archivo completo para no romper Capacitor)
          python3 - "$MANIFEST" <<'PYTHON'
import sys

ruta = sys.argv[1]
with open(ruta, 'r', encoding='utf-8') as f:
    contenido = f.read()

permisos = '''    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />

'''

if 'android.permission.CAMERA' in contenido:
    print('Los permisos ya estaban presentes.')
else:
    marcador = '<application'
    posicion = contenido.find(marcador)
    if posicion == -1:
        print('ERROR: no se encontro la etiqueta <application>')
        sys.exit(1)
    contenido = contenido[:posicion] + permisos + contenido[posicion:]
    with open(ruta, 'w', encoding='utf-8') as f:
        f.write(contenido)
    print('Permisos insertados correctamente.')

# Anadir el bloque <queries> para Android 11+ (camara y galeria)
if '<queries>' not in contenido:
    queries = '''
    <queries>
        <intent>
            <action android:name="android.media.action.IMAGE_CAPTURE" />
        </intent>
        <intent>
            <action android:name="android.intent.action.GET_CONTENT" />
            <data android:mimeType="image/*" />
        </intent>
    </queries>
</manifest>'''
    contenido = contenido.replace('</manifest>', queries)
    with open(ruta, 'w', encoding='utf-8') as f:
        f.write(contenido)
    print('Bloque <queries> agregado.')
PYTHON

          echo "--- Manifest despues ---"
          head -30 "$MANIFEST"

      - name: Copiar MainActivity personalizado
        run: |
          DEST="android/app/src/main/java/com/guarenas/proteccionanimal"
          mkdir -p "$DEST"
          cp "android_override/app/src/main/java/com/guarenas/proteccionanimal/MainActivity.java" "$DEST/MainActivity.java"

          # Capacitor genera su MainActivity en otra ruta: se elimina para
          # evitar que existan dos clases con el mismo nombre.
          rm -f "android/app/src/main/java/com/getcapacitor/myapp/MainActivity.java"
          rmdir "android/app/src/main/java/com/getcapacitor/myapp" 2>/dev/null || true

          echo "MainActivity personalizado copiado."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: proteccion-animal-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compilar:
    name: Generar APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install

      - run: npx cap add android

      - run: npx cap sync android

      - name: Permisos
        run: python3 scripts/aplicar-manifest.py android/app/src/main/AndroidManifest.xml

      - name: Pillow
        run: python3 -m pip install --user pillow

      - name: Icono
        run: python3 scripts/aplicar-iconos.py

      - name: Verificar icono
        run: test -f android/app/src/main/res/drawable/logo_alcaldia.png

      - name: MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/guarenas/proteccionanimal
          cp android_override/app/src/main/java/com/guarenas/proteccionanimal/MainActivity.java android/app/src/main/java/com/guarenas/proteccionanimal/MainActivity.java
          rm -rf android/app/src/main/java/com/getcapacitor

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: proteccion-animal-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
